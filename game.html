<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="AGOSH.EXE — the gamer version of Agosh Saini's CV. Under construction.">
  <meta name="author" content="Agosh Saini">
  <title>AGOSH.EXE — Under Construction</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Vercel Analytics -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    :root {
      --bg:      #0F0D0B;
      --accent:  #E8503A;
      --gold:    #D4AA6A;
      --outline: #2E2620;
      --t1:      #F2E8D9;
      --t2:      #C4B09A;
      --t3:      #8C7B6A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background: var(--bg);
      font-family: 'Space Grotesk', sans-serif;
      color: var(--t1);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background-image:
        linear-gradient(rgba(242,232,217,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(242,232,217,0.025) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* CRT scanline flavour */
    body::after {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(0,0,0,0) 0px, rgba(0,0,0,0) 3px,
        rgba(0,0,0,0.10) 3px, rgba(0,0,0,0.10) 4px
      );
    }

    .box {
      max-width: 560px;
      width: 100%;
      border: 2px solid var(--t2);
      box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--outline);
      background: var(--bg);
      padding: 56px 40px;
      text-align: center;
    }

    .eyebrow {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      letter-spacing: 0.1em;
      color: var(--gold);
      margin-bottom: 22px;
    }

    h1 {
      font-family: 'Press Start 2P', monospace;
      font-size: clamp(18px, 4.5vw, 28px);
      line-height: 1.5;
      color: var(--t1);
      margin-bottom: 26px;
    }

    h1 em { font-style: normal; color: var(--accent); }

    .tape {
      font-family: 'Press Start 2P', monospace;
      font-size: 9px;
      letter-spacing: 0.12em;
      color: var(--bg);
      background: repeating-linear-gradient(
        -45deg,
        var(--gold) 0px, var(--gold) 14px,
        #1A1410 14px, #1A1410 28px
      );
      padding: 12px 0;
      margin: 0 -40px 28px;
    }

    .tape span {
      background: var(--gold);
      padding: 4px 10px;
    }

    p {
      font-size: 15px;
      line-height: 1.7;
      color: var(--t2);
      margin-bottom: 30px;
    }

    .progress {
      font-family: 'Press Start 2P', monospace;
      font-size: 8px;
      color: var(--t3);
      margin-bottom: 34px;
    }

    .progress .bar { color: var(--accent); }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    .btn {
      font-family: 'Press Start 2P', monospace;
      font-size: 10px;
      background: var(--accent);
      color: var(--t1);
      padding: 16px 28px;
      text-decoration: none;
      display: inline-block;
      margin: 4px;
    }

    .btn:hover { background: #C83A26; }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--outline);
      color: var(--t3);
    }

    .btn-ghost:hover { border-color: var(--t2); color: var(--t2); }

    @media (max-width: 600px) {
      .box { padding: 44px 24px; }
      .tape { margin: 0 -24px 28px; }
    }
  </style>
</head>
<body>

<main class="box">
  <div class="eyebrow">AGOSH.EXE &middot; THE GAMER VERSION</div>
  <h1>UNDER<br><em>CONSTRUCTION</em></h1>
  <div class="tape"><span>&#9888; HARD HATS REQUIRED &#9888;</span></div>
  <p>
    The playable, pixel-art version of this CV is still being built —
    one tile at a time. Check back soon, or read the story the old-fashioned way.
  </p>
  <div class="progress">LOADING <span class="bar">&#9608;&#9608;&#9608;&#9617;&#9617;&#9617;&#9617;&#9617;&#9617;&#9617;</span> 30%<span class="blink">_</span></div>
  <a class="btn" href="/">&#9656; BACK TO SITE</a>
  <a class="btn btn-ghost" href="mailto:contact@agoshsaini.com">PING THE DEV</a>
</main>

</body>
</html>
